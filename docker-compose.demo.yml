# Demo deployment on a small VPS (4 GB RAM, 1 user).
# Usage: docker compose -f docker-compose.demo.yml up --build -d

x-postgres-demo: &postgres-demo
  image: ${POSTGRES_IMAGE:-postgres:16}
  restart: unless-stopped
  networks:
    - bsps
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 5s
    retries: 10
    start_period: 10s
  deploy:
    resources:
      limits:
        memory: 256M

x-java-demo: &java-demo
  restart: unless-stopped
  networks:
    - bsps
  environment: &java-demo-env
    SPRING_PROFILES_ACTIVE: docker
    JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-user}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
    SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
    SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
  deploy:
    resources:
      limits:
        memory: 512M

services:
  postgres-client:
    <<: *postgres-demo
    container_name: bsps-postgres-client
    environment:
      POSTGRES_DB: client-service
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres-client-data:/var/lib/postgresql/data

  postgres-application:
    <<: *postgres-demo
    container_name: bsps-postgres-application
    environment:
      POSTGRES_DB: application-service
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres-application-data:/var/lib/postgresql/data

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3-management}
    container_name: bsps-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - bsps
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384M

  client-service:
    <<: *java-demo
    build:
      context: ../client-service
      dockerfile: ../bsps-infra/docker/client-service/Dockerfile
    image: bsps/client-service:demo
    container_name: bsps-client-service
    environment:
      <<: *java-demo-env
    ports:
      - "${CLIENT_SERVICE_PORT:-8080}:8080"
    depends_on:
      postgres-client:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/v3/api-docs || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 120s

  application-service:
    <<: *java-demo
    build:
      context: ../application-service
      dockerfile: ../bsps-infra/docker/application-service/Dockerfile
    image: bsps/application-service:demo
    container_name: bsps-application-service
    environment:
      <<: *java-demo-env
    ports:
      - "${APPLICATION_SERVICE_PORT:-8082}:8082"
    depends_on:
      postgres-application:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/v3/api-docs || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 120s

  application-gateway:
    <<: *java-demo
    build:
      context: ../application-gateway
      dockerfile: ../bsps-infra/docker/application-gateway/Dockerfile
    image: bsps/application-gateway:demo
    container_name: bsps-application-gateway
    environment:
      <<: *java-demo-env
      SPRING_PROFILES_ACTIVE: docker,demo
    ports:
      - "${GATEWAY_PORT:-8088}:8088"
    depends_on:
      client-service:
        condition: service_healthy
      application-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8088/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 448M

  application-ui:
    build:
      context: ../application-ui
      dockerfile: ../bsps-infra/docker/application-ui/Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-http://localhost:8088}
        REACT_APP_INITIATOR_LOGIN: ${REACT_APP_INITIATOR_LOGIN:-operator}
    image: bsps/application-ui:demo
    container_name: bsps-application-ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-3000}:80"
    networks:
      - bsps
    depends_on:
      application-gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  bsps:
    name: bsps-network

volumes:
  postgres-client-data:
  postgres-application-data:
  rabbitmq-data:
